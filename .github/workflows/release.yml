name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Get version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Replace version placeholder in the installation script
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/__VERSION__/$VERSION/g" install.sh

      - name: Upload release assets
        run: |
          # upload the env.sh
          gh release upload ${{ github.event.release.tag_name }} env.sh

          # upload the installation script
          gh release upload ${{ github.event.release.tag_name }} install.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
